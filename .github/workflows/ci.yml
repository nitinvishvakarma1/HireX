name: CI

# Runs on pull requests targeting the long-lived branches. Keep it fast and
# correct: workspace steps use the root scripts (which fan out with
# `--workspaces --if-present`), so a job never fails just because a workspace
# legitimately lacks a given script.
on:
  pull_request:
    branches: [development, master]

# Cancel superseded runs for the same PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Prefer a reproducible install from the lockfile; fall back to a plain
      # install if the lockfile has not been committed yet.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json found — using 'npm install'."
            npm install
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm run test --if-present

  python:
    name: Python worker (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Python worker (apps/worker) may not exist yet in early phases;
      # detect it so the checks below are skipped cleanly rather than failing.
      - name: Detect worker
        id: worker
        run: |
          if [ -d apps/worker ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/worker not found — skipping Python checks."
          fi

      - name: Install dependencies
        if: steps.worker.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/worker/requirements.txt ]; then
            pip install -r apps/worker/requirements.txt
          fi
          # Ensure the tooling is available even if not pinned in requirements.
          pip install "ruff==0.6.9" "mypy==1.11.2" "pytest==8.3.3"

      - name: Ruff (lint)
        if: steps.worker.outputs.present == 'true'
        run: ruff check apps/worker

      - name: Mypy (typecheck)
        if: steps.worker.outputs.present == 'true'
        run: mypy apps/worker

      # Exit code 5 means "no tests collected" — treat that as a pass, not a failure.
      - name: Pytest
        if: steps.worker.outputs.present == 'true'
        run: |
          code=0
          pytest apps/worker || code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected — skipping."
            exit 0
          fi
          exit "$code"
