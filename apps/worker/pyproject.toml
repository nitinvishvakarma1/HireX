[project]
name = "hirex-worker"
version = "0.1.0"
description = "HireX AI/automation worker — parsing, tailoring, and ATS automation."
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# ---------------------------------------------------------------------------
# Formatting & linting — non-negotiable, run in CI (rulebook §2).
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
# A pragmatic, strict-ish default set.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by black/formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]  # allow fixture defaults in tests

# ---------------------------------------------------------------------------
# Static typing — type everything (rulebook §2, §10).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without bundled stubs.
module = ["celery.*", "playwright.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
